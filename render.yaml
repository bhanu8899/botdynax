databases:
  - name: botdynax-db
    plan: free

services:
  - type: web
    name: botdynax-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: botdynax-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN_DAYS
        value: "30"
      # Set these two in the Render dashboard after the first deploy —
      # Blueprint envVars can't hold real secret values inline.
      # See backend/README.md for where to find them.
      - key: TUYA_CLIENT_ID
        sync: false
      - key: TUYA_CLIENT_SECRET
        sync: false
      - key: TUYA_BASE_URL
        value: https://openapi.tuyain.com
      - key: TUYA_REDIRECT_URI
        value: botdynax://tuya-callback
